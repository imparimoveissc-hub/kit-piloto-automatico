automation_status: draft
process_name: "Atualizacao mensal de tabelas Rogga no site da Impar"
segment: "Imobiliaria"
owner: "Jonata / Impar Imoveis"
goal: "Validar tabelas e valores dos imoveis da Rogga e atualizar os mesmos dados no CRM/site Imobibrasil da Impar Imoveis."
automation_scope:
  phase_1: "100% automatico para leitura Rogga, leitura site publico Impar, comparacao e relatorio."
  phase_2: "Atualizacao no Imobibrasil em modo assistido, exigindo aprovacao humana por execucao."
  phase_3: "Atualizacao no Imobibrasil 100% automatica somente apos multiplos dry-runs aprovados, credenciais seguras, teste de rollback e autorizacao explicita do Jonata."
pricing_rule:
  source_of_truth: "Rogga"
  target_value: "menor valor de unidade residencial disponivel"
  include: "apartamentos/unidades residenciais do empreendimento"
  exclude: "vaga extra, vaga de garagem ou qualquer unidade que seja apenas garagem"
  multi_table_rule: "Quando houver primeira fase, segunda fase, terceira fase ou tabelas equivalentes, varrer todas as tabelas/fases do empreendimento e escolher o menor valor residencial valido."
  ambiguity_rule: "Se nao for possivel distinguir unidade residencial de garagem, marcar como nao validado e pedir revisao humana."
schedule:
  timezone: "America/Sao_Paulo"
  days_of_month: [2, 3, 15, 20, 25]
  default_time: "09:00"
trigger:
  type: schedule
  description: "Rodar todo dia 02, 03, 15, 20 e 25 de cada mes, inicialmente em modo assistido."
inputs:
  - name: "Credenciais Rogga"
    source: ".env local ou login/OAuth assistido"
    required: true
    example: "[A PREENCHER]"
  - name: "Acesso ao e-mail do codigo Rogga"
    source: "OAuth Microsoft Graph/Outlook ou IMAP autorizado pelo usuario"
    required: true
    example: "[A PREENCHER]"
  - name: "Credenciais Imobibrasil"
    source: ".env local ou login assistido"
    required: true
    example: "[A PREENCHER]"
  - name: "Mapa de imoveis"
    source: "Planilha/CSV em 05_WORKSPACE/clientes/impar-imoveis/automacoes/"
    required: true
    example: "codigo_imobibrasil, codigo_site_impar, nome_imovel, url_site_impar, rogga_unidades_urls, rogga_tabela_urls, regra_preco, status_automacao"
  - name: "Pagina publica do imovel na Impar"
    source: "Site publico da Impar"
    required: true
    example: "https://www.imparimoveis.com/imovel/3824292/apartamento-na-planta-venda-joinville-sc-itaum"
  - name: "Lista de fases/tabelas Rogga"
    source: "Rogga"
    required: false
    example: "Urban Baviera primeira fase; Urban Baviera segunda fase; Urban Baviera terceira fase"
steps:
  - id: "S0"
    name: "Carregar fila de imoveis"
    mode: "automated"
    actor: "ai_agent"
    description: "Ler o mapa de imoveis, validar URLs obrigatorias e separar imoveis habilitados para comparacao automatica."
    tool: "CSV/planilha local"
    input: "imoveis-mapa.csv"
    output: "fila validada de imoveis"
    approval_required: false
  - id: "S1"
    name: "Abrir Rogga Vendas"
    mode: "automated"
    actor: "ai_agent"
    description: "Acessar https://vendas.rogga.com.br e iniciar login com credencial segura."
    tool: "Browser automation"
    input: "Credenciais Rogga"
    output: "Tela de verificacao/codigo solicitada"
    approval_required: false
  - id: "S2"
    name: "Solicitar codigo por e-mail"
    mode: "automated"
    actor: "ai_agent"
    description: "Selecionar opcao de recebimento do codigo por e-mail, se disponivel."
    tool: "Browser automation"
    input: "Sessao Rogga"
    output: "Codigo enviado para e-mail autorizado"
    approval_required: false
  - id: "S3"
    name: "Ler codigo no e-mail"
    mode: "ai_assisted"
    actor: "tool"
    description: "Buscar o e-mail mais recente da Rogga, extrair apenas o codigo de verificacao e inserir na plataforma."
    tool: "Gmail/OAuth ou IMAP autorizado"
    input: "Acesso ao e-mail"
    output: "Sessao Rogga autenticada"
    approval_required: true
  - id: "S4"
    name: "Extrair tabelas Rogga"
    mode: "automated"
    actor: "ai_agent"
    description: "Para cada imovel mapeado, abrir todos os links Rogga de unidades/fases, capturar as tabelas disponiveis, ignorar vagas de garagem e identificar a menor unidade residencial valida."
    tool: "Browser automation + parser estruturado"
    input: "Mapa de imoveis"
    output: "snapshot_rogga.csv, menor_valor_residencial e evidencias"
    approval_required: false
  - id: "S5"
    name: "Comparar com site publico da Impar"
    mode: "automated"
    actor: "ai_agent"
    description: "Acessar a pagina publica do imovel no site da Impar e comparar os dados visiveis com a fonte Rogga."
    tool: "Browser automation"
    input: "URL publica do imovel + snapshot Rogga"
    output: "relatorio de diferencas"
    approval_required: false
  - id: "S5b"
    name: "Gerar relatorio consolidado"
    mode: "automated"
    actor: "ai_agent"
    description: "Gerar relatorio por imovel e um resumo consolidado com divergencias, valores atuais, valores recomendados e bloqueios."
    tool: "Markdown/CSV"
    input: "comparacoes por imovel"
    output: "relatorio consolidado em 06_OUTPUTS"
    approval_required: false
  - id: "S6"
    name: "Aprovar alteracoes"
    mode: "manual"
    actor: "human"
    description: "Jonata revisa as diferencas antes de qualquer atualizacao real no CRM/site."
    tool: "Relatorio em Markdown/CSV"
    input: "relatorio de diferencas"
    output: "aprovacao ou ajustes"
    approval_required: true
  - id: "S7"
    name: "Atualizar Imobibrasil"
    mode: "blocked"
    actor: "ai_agent"
    description: "Alterar tabelas/valores no CRM Imobibrasil somente apos confirmacao explicita."
    tool: "Browser automation"
    input: "aprovacao humana"
    output: "site atualizado + log de mudancas"
    approval_required: true
  - id: "S8"
    name: "Validar publicacao"
    mode: "ai_assisted"
    actor: "ai_agent"
    description: "Reabrir o imovel publicado no site da Impar e conferir se os valores batem com o relatorio aprovado."
    tool: "Browser automation"
    input: "URLs dos imoveis"
    output: "relatorio final de validacao"
    approval_required: false
decision_points:
  - id: "D1"
    condition: "Rogga indisponivel, login falhou ou codigo de e-mail nao chegou."
    if_true: "Bloquear a execucao e pedir intervencao humana. Nao usar fonte alternativa."
    if_false: "Usar Rogga como fonte unica/oficial."
  - id: "D2"
    condition: "Dado do site publico diverge da Rogga."
    if_true: "Marcar divergencia no relatorio e recomendar revisao/atualizacao posterior no CRM."
    if_false: "Marcar como sem acao."
  - id: "D3"
    condition: "Alteracao impacta preco, condicao comercial, disponibilidade ou status publicado."
    if_true: "Exigir aprovacao humana antes de salvar."
    if_false: "Registrar como sem alteracao critica."
  - id: "D4"
    condition: "Linha/unidade contem 'vaga extra', 'vaga de garagem' ou indica apenas garagem."
    if_true: "Excluir da lista de menores valores e registrar como item ignorado."
    if_false: "Considerar apenas se for unidade residencial valida."
human_handoff:
  required: true
  when: "Antes de salvar qualquer alteracao no Imobibrasil ou quando houver divergencia entre Rogga e site publico."
  responsible: "Jonata"
tools:
  - name: "Rogga Vendas"
    purpose: "Fonte primaria das tabelas e valores."
    access_needed: "Login + codigo por e-mail."
    risk_level: "medium"
  - name: "E-mail autorizado"
    purpose: "Receber codigo de verificacao Rogga."
    access_needed: "OAuth Microsoft Graph/Outlook ou IMAP autorizado; nunca senha no chat."
    risk_level: "high"
  - name: "Imobibrasil"
    purpose: "CRM/site onde os imoveis da Impar sao atualizados."
    access_needed: "Login seguro."
    risk_level: "high"
  - name: "Site publico da Impar"
    purpose: "Conferir o que clientes veem antes de qualquer atualizacao no CRM."
    access_needed: "URL publica do imovel."
    risk_level: "low"
data_privacy:
  personal_data: "possible"
  sensitive_data: "yes"
  notes: "Credenciais, codigos de verificacao e dados comerciais devem ficar fora do chat e fora do Git. Usar .env local, OAuth ou login assistido."
test_plan:
  dry_run_input: "1 imovel piloto com codigo Rogga, codigo Imobibrasil e link de Drive opcional."
  expected_output: "Relatorio de diferencas sem salvar alteracoes no Imobibrasil."
  pass_criteria: "Captura correta da fonte, comparacao correta e nenhum update real sem aprovacao."
rollback_plan:
  how_to_stop: "Manter automacao pausada ou desativar agendamento no Codex/n8n/Make."
  how_to_restore: "Usar snapshot anterior do Imobibrasil e log de mudancas para recolocar valores antigos manualmente."
recommendation:
  preferred_source: "Rogga como fonte unica/oficial."
  reason: "Usar uma fonte oficial reduz conflito de dados. Se Rogga falhar, a rotina deve parar em vez de tentar inferir valores por outra origem."
  browser: "Navegador interno do Codex com login assistido."
  browser_reason: "Ambiente mais controlado para rotina recorrente; evita depender do Safari/Chrome pessoal e reduz variacao entre execucoes."
next_action: "Rodar primeiro dry-run com o Residencial Baviera, comparando menor valor residencial valido da Rogga x site publico, sem abrir o CRM."
